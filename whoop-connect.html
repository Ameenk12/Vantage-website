<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://dopbkfbzwhacnxgmaont.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Connect WHOOP · Vantage</title>
  <link rel="stylesheet" href="style.css">
  <script src="whoop-config.js" defer></script>
  <script src="whoop-connect.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Connect WHOOP</h1>
    <p>Sign in to the same Vantage account you use in the app. Then approve access to WHOOP. Keep this browser tab open until you return to Vantage.</p>
    <p id="status" role="status" aria-live="polite">Preparing secure sign-in…</p>
    <section id="signin" hidden aria-label="Sign in to Vantage">
      <form id="password-form">
        <p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="username" required></p>
        <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required></p>
        <button type="submit">Sign in and continue</button>
      </form>
      <p>Or sign in with</p>
      <button id="google" type="button">Google</button>
      <button id="apple" type="button">Apple</button>
    </section>
    <p><button id="restart" type="button" hidden>Start sign-in again</button> <button id="cancel" type="button">Cancel</button></p>
    <p>Your Vantage password is sent only to Vantage authentication. WHOOP access is optional.</p>
  </main>
</body>
</html>
